baseURL: https://blog.sploder.org/
locale: en-us
theme: ["PaperMod"]
enableRobotsTXT: true

services:
  disqus:
    shortname: trevors-shoebox

title: "Trevor's Shoebox"
copyright: "© [Trevor Schupbach](https://github.com/sploder12)"
params:
  favicon: "./favicon.ico"

  profileMode:
    enabled: true
    imageUrl: "./shoebox.png"
    imageTitle: "Profile Picture"
    subtitle: What will we find today?
    buttons:
      - name: About
        url: about
      - name: Posts
        url: posts/


  socialIcons:
    - name: github
      title: GitHub Profile
      url: "https://github.com/sploder12/"
    - name: LinkedIn
      title: LinkedIn Profile
      url: "https://www.linkedin.com/in/trevor-schupbach/"
    - name: KoFi
      title: Support me on Ko-Fi
      url: "https://ko-fi.com/trevorshoebox"

  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  
  comments: true
  math: true

  editPost:
    URL: "https://github.com/Sploder12/ShoeboxBlog/content"
    Text: "Suggest Changes"
    appendFilePath: true

menu:
  main:
    - name: About
      url: about
    - name: Blog
      url: posts/
    - name: Search
      url: search

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

caches:
  images:
    dir: :cacheDir/images
